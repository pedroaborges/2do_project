{% extends 'base.html' %}
{% load static %}

{% block 'title' %} 2DO notification {% endblock %}

{% block 'body' %}

<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<div class="bg-purple-950 min-h-screen flex items-center justify-center p-4">

    <div class="bg-purple-900 p-8 rounded-lg shadow-md w-full max-w-md">

        <h2 class="text-2xl font-bold text-purple-50 mb-6 text-center">
            Verifique seu E-mail
        </h2>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="email" class="block text-sm font-medium text-purple-200 mb-1">
                    Digite seu e-mail:
                </label>
                <input type="email" name="email" id="email" required 
                       class="w-full px-4 py-2 border border-purple-700 bg-purple-800 text-purple-50 rounded-md shadow-sm
                              placeholder-purple-400
                              focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-pink-500">
                </div>
            
            <button type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm
                           text-sm font-medium text-white bg-purple-600 hover:bg-purple-700
                           focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-purple-900 focus:ring-purple-500">
                Enviar E-mail de Verificação
            </button>
            
            <div class="text-center">
                <a href="{% url 'home' %}" 
                   class="font-medium text-sm text-purple-400 hover:text-purple-300 hover:underline">
                    Pular por agora
                </a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
