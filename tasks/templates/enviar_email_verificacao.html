<!-- enviar_email_verificacao.html -->
<form method="POST">
    {% csrf_token %}
    <label for="email">Digite seu e-mail:</label>
    <input type="email" name="email" required>
    <button type="submit">Enviar E-mail de Verificação</button>
    <button><a href="{% url 'home' %}">Pular</a></button>
</form>
